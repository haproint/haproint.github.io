<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAPRO BOARD 이미지 업로드 테스트</title><style>body{font-family:system-ui,sans-serif;max-width:560px;margin:45px auto;padding:0 20px;color:#20242a}h1{font-size:24px}label{display:block;margin:18px 0 7px;font-weight:600}input,button{box-sizing:border-box;width:100%;padding:12px;font-size:16px}button{margin-top:22px;background:#162b40;color:white;border:0;border-radius:6px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f5f7;padding:15px;border-radius:6px}small{color:#555}</style></head><body><h1>HAPRO INT. 사진 업로드 테스트</h1><p>방문자 게시글 <strong>ID 7</strong> 전용입니다. 기존 홈페이지 코드는 변경하지 않습니다.</p><p><small>테스트 성공 시 게시글 ID 7에 이미지가 실제 저장되며, 현재 함수는 같은 게시글에 두 번째 이미지를 허용하지 않습니다.</small></p><form id="form"><label for="password">게시글 비밀번호</label><input id="password" type="password" required autocomplete="off" maxlength="200"><label for="file">사진 선택 (JPG, PNG, WEBP / 5MB 이하)</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp" required><button id="send" type="submit">게시글 ID 7에 사진 업로드</button></form><h2>응답 결과</h2><pre id="result">아직 전송하지 않았습니다.</pre><script>const endpoint='https://hjlvhsfyifntcvmpaocq.supabase.co/functions/v1/board-image-upload';const form=document.getElementById('form'),result=document.getElementById('result'),button=document.getElementById('send');form.addEventListener('submit',async e=>{e.preventDefault();const file=document.getElementById('file').files[0];const password=document.getElementById('password').value;if(!file||!password)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024||file.size===0){result.textContent='이미지 형식 또는 크기를 확인하세요.';return;}if(!confirm('게시글 ID 7에 선택한 사진을 실제로 저장하시겠습니까?'))return;const body=new FormData();body.append('file',file);body.append('board','guest');body.append('post_id','7');body.append('password',password);button.disabled=true;result.textContent='전송 중...';try{const response=await fetch(endpoint,{method:'POST',body});const payload=await response.text();let output;try{output=JSON.stringify(JSON.parse(payload),null,2)}catch{output=payload}result.textContent=`HTTP ${response.status}\n${output}`;}catch(error){result.textContent='네트워크 또는 CORS 오류: '+String(error)}finally{document.getElementById('password').value='';button.disabled=false;}});</script></body></html>
